<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Santa 2026</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#32634e,#102e25);color:#fff8e8;font:17px system-ui;padding:20px}main{width:min(100%,480px);padding:32px;border:1px solid #bfa66b;border-radius:24px;background:#173e32;box-shadow:0 20px 60px #0005;text-align:center}h1{font-family:Georgia;font-size:38px;margin:12px 0}small{color:#e8ca85;letter-spacing:2px}input,select,button{width:100%;padding:14px;border-radius:10px;font:inherit;margin:8px 0;border:1px solid #bfa66b}button{background:#a62e3d;color:white;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}button.secondary{background:transparent}label{display:block;text-align:left;margin-top:12px}#result{font: bold 36px Georgia;color:#e8ca85}table{width:100%;font-size:14px;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ffffff30;text-align:left}[hidden]{display:none!important}#status{min-height:24px;color:#ffd9a0}footer{margin-top:24px}a{color:#e8ca85} </style></head><body><main><small>✦ NOËL 2026 ✦</small><h1>🎄 Secret Santa</h1><p>Budget par cadeau : <strong>30 à 60 €</strong></p><section id="home"><form id="choose"><label for="name">Quel est ton prénom ?</label><select id="name" required><option value="">Choisir mon prénom</option><option>Anne</option><option>Did</option><option>Tom</option><option>Gilles</option><option>Cricri</option><option>Raymond</option><option>Sophie</option><option>David</option><option>Maë</option></select><button>Continuer</button></form></section><section id="step" hidden><h2 id="hello"></h2><form id="reveal"><label for="code">Ton code personnel</label><input id="code" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false"><button>🎁 Lancer mon tirage</button></form><button class="secondary" data-home>Retour</button></section><section id="gift" hidden><p>Tu offres un cadeau à…</p><p id="result"></p><p>Garde la surprise !</p><button data-home>Terminer et masquer</button></section><section id="admin" hidden><h2>Espace organisateur</h2><form id="login"><label for="email">Adresse e-mail</label><input id="email" type="email" required autocomplete="username"><label for="password">Mot de passe</label><input id="password" type="password" required autocomplete="current-password"><button>Connexion</button></form><div id="dashboard" hidden><table><thead><tr><th>Participant</th><th>Destinataire</th><th>Consulté</th></tr></thead><tbody id="rows"></tbody></table><button id="refresh">Actualiser</button><button id="logout">Déconnexion</button></div><button class="secondary" data-home>Retour</button></section><p id="status" role="status"></p><footer><a href="#organisateur" id="adminlink">Espace organisateur</a></footer></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://zpulzkozvgdltcfztchc.supabase.co', KEY='sb_publishable_7dMtqY3kifJR-rQtGz_FMQ_dbw3eSy9';
const $=id=>document.getElementById(id);const db=createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false}});let selected='';
function show(id){for(const x of ['home','step','gift','admin']) $(x).hidden=x!==id;$('status').textContent='';$('adminlink').hidden=id!=='home';}
async function home(){await db.auth.signOut();selected='';$('name').value='';$('code').value='';$('password').value='';$('result').textContent='';$('rows').replaceChildren();$('dashboard').hidden=true;$('login').hidden=false;show('home');}
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);
$('choose').onsubmit=e=>{e.preventDefault();selected=$('name').value;$('hello').textContent='Bonjour '+selected+' !';show('step');};
$('reveal').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {data,error}=await db.rpc('santa_reveal',{p_name:selected,p_code:$('code').value.trim().toLowerCase()});if(error||!data){$('status').textContent='Code incorrect ou service indisponible.';return;}$('result').textContent=data;$('code').value='';show('gift');}catch{$('status').textContent='Connexion impossible.';}finally{b.disabled=false;}};
$('adminlink').onclick=e=>{e.preventDefault();show('admin');};
async function results(){const {data,error}=await db.rpc('santa_results');if(error){$('status').textContent='Accès refusé ou service indisponible.';return false;}$('rows').replaceChildren();for(const r of data){const tr=document.createElement('tr');for(const v of [r.name,r.recipient,r.seen_at?'Oui':'Non']){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('rows').append(tr);}return true;}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error){$('status').textContent='Identifiants incorrects.';return;}if(await results()){$('login').hidden=true;$('dashboard').hidden=false;$('status').textContent='';}else await db.auth.signOut();}catch{$('status').textContent='Connexion impossible.';}finally{b.disabled=false;}};$('refresh').onclick=results;$('logout').onclick=home;
</script></body></html>
